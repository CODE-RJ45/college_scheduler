<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .text-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .header-title { font-size: 14px; font-weight: 600; fill: #f8fafc; }
      .nav-tab { font-size: 13px; font-weight: 600; fill: #475569; }
      .nav-active { font-size: 13px; font-weight: 600; fill: #2563eb; }
      .section-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtext { font-size: 13px; font-weight: 400; fill: #64748b; }
      .kpi-num { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .kpi-label { font-size: 11px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
      .log-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .log-time { font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #64748b; }
      .log-msg { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #334155; }
      .tbl-head { font-size: 11px; font-weight: 600; fill: #64748b; text-transform: uppercase; }
      .tbl-cell { font-size: 12px; font-weight: 500; fill: #1e293b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc" />

  <!-- Window Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- App Header -->
  <path d="M 20 30 Q 20 20 30 20 L 1170 20 Q 1180 20 1180 30 L 1180 75 L 20 75 Z" fill="#0f172a" />
  <circle cx="45" cy="47" r="6" fill="#ef4444" />
  <circle cx="65" cy="47" r="6" fill="#f59e0b" />
  <circle cx="85" cy="47" r="6" fill="#10b981" />
  <text x="115" y="52" class="text-base header-title">Institutional Academic Scheduler — Auto-Scheduling Engine</text>

  <!-- Top Navigation Bar -->
  <rect x="20" y="75" width="1160" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="104" class="text-base nav-tab">Analytics</text>
  <text x="120" y="104" class="text-base nav-tab">Course Assignments</text>
  <text x="260" y="104" class="text-base nav-tab">Master Calendar</text>
  <text x="390" y="104" class="text-base nav-tab">Faculty</text>
  <text x="455" y="104" class="text-base nav-tab">Courses</text>
  <text x="525" y="104" class="text-base nav-tab">Sections</text>
  <text x="595" y="104" class="text-base nav-tab">Rooms</text>
  <text x="660" y="104" class="text-base nav-active">Auto-Schedule</text>
  <line x1="660" y1="121" x2="760" y2="121" stroke="#2563eb" stroke-width="2.5" />

  <!-- Header Banner -->
  <g transform="translate(45, 145)">
    <text x="0" y="0" class="text-base section-title">Automated Timetable Generation Engine</text>
    <text x="0" y="20" class="text-base subtext">Multi-pass constraint satisfaction algorithm for room, instructor, and curriculum conflict resolution</text>
    
    <!-- Action Run Button -->
    <rect x="940" y="-18" width="170" height="38" rx="6" fill="#2563eb" />
    <text x="1025" y="6" class="text-base" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Execute Scheduler</text>
  </g>

  <!-- KPI Metrics Grid -->
  <g transform="translate(45, 195)">
    <!-- Metric 1: Scheduled Curriculum -->
    <rect x="0" y="0" width="265" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="28" class="text-base kpi-label">Curriculum Scheduled</text>
    <text x="20" y="62" class="text-base kpi-num">100%</text>
    <rect x="180" y="20" width="65" height="22" rx="4" fill="#ecfdf5" />
    <text x="212" y="35" class="text-base" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">Optimal</text>

    <!-- Metric 2: Conflict Score -->
    <rect x="285" y="0" width="265" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="305" y="28" class="text-base kpi-label">Hard Conflicts</text>
    <text x="305" y="62" class="text-base kpi-num">0</text>
    <rect x="465" y="20" width="65" height="22" rx="4" fill="#eff6ff" />
    <text x="497" y="35" class="text-base" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Zero Col.</text>

    <!-- Metric 3: Room Efficiency -->
    <rect x="570" y="0" width="265" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="590" y="28" class="text-base kpi-label">Facility Utilization</text>
    <text x="590" y="62" class="text-base kpi-num">89.2%</text>
    <rect x="750" y="20" width="65" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="782" y="35" class="text-base" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">24 Rooms</text>

    <!-- Metric 4: Computation Runtime -->
    <rect x="855" y="0" width="255" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="875" y="28" class="text-base kpi-label">Algorithm Run Time</text>
    <text x="875" y="62" class="text-base kpi-num">1.42s</text>
    <rect x="1015" y="20" width="75" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="1052" y="35" class="text-base" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Pass 1 &amp; 2</text>
  </g>

  <!-- Left: Execution Pipeline Console -->
  <g transform="translate(45, 305)">
    <rect x="0" y="0" width="460" height="315" rx="8" fill="#0f172a" />
    <rect x="0" y="0" width="460" height="38" rx="8" fill="#1e293b" />
    <text x="20" y="24" class="text-base" font-size="12" font-weight="600" fill="#94a3b8">ENGINE EXECUTION PIPELINE</text>
    
    <!-- Stage 1 -->
    <circle cx="28" cy="65" r="4" fill="#10b981" />
    <text x="45" y="70" class="text-base log-time">[PASS 1]</text>
    <text x="110" y="70" class="text-base log-msg" fill="#cbd5e1">Validating curriculum &amp; section requirements...</text>
    <text x="45" y="90" class="text-base log-msg" fill="#94a3b8">  - Loaded 42 sections, 186 subjects across 4 terms</text>

    <!-- Stage 2 -->
    <circle cx="28" cy="125" r="4" fill="#10b981" />
    <text x="45" y="130" class="text-base log-time">[PASS 2]</text>
    <text x="110" y="130" class="text-base log-msg" fill="#cbd5e1">Instructor constraint &amp; load balancing check...</text>
    <text x="45" y="150" class="text-base log-msg" fill="#94a3b8">  - Enforced max load (24 units), 0 over-allocations</text>
    <text x="45" y="170" class="text-base log-msg" fill="#94a3b8">  - Availability matrices matched with faculty pref</text>

    <!-- Stage 3 -->
    <circle cx="28" cy="205" r="4" fill="#10b981" />
    <text x="45" y="210" class="text-base log-time">[PASS 3]</text>
    <text x="110" y="210" class="text-base log-msg" fill="#cbd5e1">Room physical capacity &amp; lab pairing optimization...</text>
    <text x="45" y="230" class="text-base log-msg" fill="#94a3b8">  - Assigned 38 lab blocks to specialized laboratories</text>
    <text x="45" y="250" class="text-base log-msg" fill="#94a3b8">  - Lecture halls allocated with zero space violations</text>

    <!-- Success Footer -->
    <rect x="20" y="275" width="420" height="28" rx="4" fill="#1e293b" />
    <text x="230" y="293" class="text-base log-time" fill="#34d399" text-anchor="middle">✔ Complete: 186/186 slots assigned with 0 conflicts</text>
  </g>

  <!-- Right: Generated Schedule Batch Result Table -->
  <g transform="translate(525, 305)">
    <rect x="0" y="0" width="630" height="315" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Table Header -->
    <rect x="0" y="0" width="630" height="36" fill="#f8fafc" rx="8" />
    <text x="20" y="22" class="text-base tbl-head">Subject</text>
    <text x="140" y="22" class="text-base tbl-head">Section</text>
    <text x="240" y="22" class="text-base tbl-head">Assigned Instructor</text>
    <text x="400" y="22" class="text-base tbl-head">Room</text>
    <text x="510" y="22" class="text-base tbl-head">Time Window</text>

    <!-- Row 1 -->
    <line x1="0" y1="76" x2="630" y2="76" stroke="#f1f5f9" stroke-width="1" />
    <text x="20" y="60" class="text-base tbl-cell" font-weight="600">CS101 (Lec)</text>
    <text x="140" y="60" class="text-base tbl-cell">BSCS 1-A</text>
    <text x="240" y="60" class="text-base tbl-cell">Prof. Alan Turing</text>
    <text x="400" y="60" class="text-base tbl-cell">Room 301</text>
    <text x="510" y="60" class="text-base tbl-cell" fill="#2563eb">M/W 08:00 - 09:30</text>

    <!-- Row 2 -->
    <line x1="0" y1="122" x2="630" y2="122" stroke="#f1f5f9" stroke-width="1" />
    <text x="20" y="106" class="text-base tbl-cell" font-weight="600">CS101 (Lab)</text>
    <text x="140" y="106" class="text-base tbl-cell">BSCS 1-A</text>
    <text x="240" y="106" class="text-base tbl-cell">Prof. Alan Turing</text>
    <text x="400" y="106" class="text-base tbl-cell">ComLab 2</text>
    <text x="510" y="106" class="text-base tbl-cell" fill="#2563eb">Fri 08:00 - 11:00</text>

    <!-- Row 3 -->
    <line x1="0" y1="168" x2="630" y2="168" stroke="#f1f5f9" stroke-width="1" />
    <text x="20" y="152" class="text-base tbl-cell" font-weight="600">IT202 (Lec)</text>
    <text x="140" y="152" class="text-base tbl-cell">BSIT 2-B</text>
    <text x="240" y="152" class="text-base tbl-cell">Dr. Ada Lovelace</text>
    <text x="400" y="152" class="text-base tbl-cell">Room 204</text>
    <text x="510" y="152" class="text-base tbl-cell" fill="#2563eb">T/Th 09:30 - 11:00</text>

    <!-- Row 4 -->
    <line x1="0" y1="214" x2="630" y2="214" stroke="#f1f5f9" stroke-width="1" />
    <text x="20" y="198" class="text-base tbl-cell" font-weight="600">NET301 (Lec)</text>
    <text x="140" y="198" class="text-base tbl-cell">BSIT 3-A</text>
    <text x="240" y="198" class="text-base tbl-cell">Engr. Claude Shannon</text>
    <text x="400" y="198" class="text-base tbl-cell">Room 402</text>
    <text x="510" y="198" class="text-base tbl-cell" fill="#2563eb">M/W 01:00 - 02:30</text>

    <!-- Row 5 -->
    <line x1="0" y1="260" x2="630" y2="260" stroke="#f1f5f9" stroke-width="1" />
    <text x="20" y="244" class="text-base tbl-cell" font-weight="600">CS401 (Capstone)</text>
    <text x="140" y="244" class="text-base tbl-cell">BSCS 4-A</text>
    <text x="240" y="244" class="text-base tbl-cell">Dr. John von Neumann</text>
    <text x="400" y="244" class="text-base tbl-cell">Seminar Rm 1</text>
    <text x="510" y="244" class="text-base tbl-cell" fill="#2563eb">Fri 01:00 - 04:00</text>

    <!-- Table Footer Navigation -->
    <rect x="0" y="275" width="630" height="40" fill="#f8fafc" rx="8" />
    <text x="20" y="299" class="text-base" font-size="12" font-weight="500" fill="#64748b">Showing 1 to 5 of 186 scheduled subjects</text>
    <text x="580" y="299" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Page 1 / 38 &gt;</text>
  </g>
</svg>

