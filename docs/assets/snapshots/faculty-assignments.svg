<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .text-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .header-title { font-size: 14px; font-weight: 600; fill: #f8fafc; }
      .nav-tab { font-size: 13px; font-weight: 600; fill: #475569; }
      .nav-active { font-size: 13px; font-weight: 600; fill: #2563eb; }
      .section-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtext { font-size: 13px; font-weight: 400; fill: #64748b; }
      .card-name { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .card-dept { font-size: 12px; font-weight: 500; fill: #64748b; }
      .stat-label { font-size: 11px; font-weight: 500; fill: #64748b; }
      .stat-val { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .tag-text { font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc" />

  <!-- Window Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- App Header -->
  <path d="M 20 30 Q 20 20 30 20 L 1170 20 Q 1180 20 1180 30 L 1180 75 L 20 75 Z" fill="#0f172a" />
  <circle cx="45" cy="47" r="6" fill="#ef4444" />
  <circle cx="65" cy="47" r="6" fill="#f59e0b" />
  <circle cx="85" cy="47" r="6" fill="#10b981" />
  <text x="115" y="52" class="text-base header-title">Institutional Academic Scheduler — Faculty Load &amp; Assignments</text>

  <!-- Top Navigation Bar -->
  <rect x="20" y="75" width="1160" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="104" class="text-base nav-tab">Analytics</text>
  <text x="120" y="104" class="text-base nav-active">Course Assignments</text>
  <line x1="120" y1="121" x2="245" y2="121" stroke="#2563eb" stroke-width="2.5" />
  <text x="270" y="104" class="text-base nav-tab">Master Calendar</text>
  <text x="390" y="104" class="text-base nav-tab">Faculty</text>
  <text x="455" y="104" class="text-base nav-tab">Courses</text>
  <text x="525" y="104" class="text-base nav-tab">Sections</text>
  <text x="595" y="104" class="text-base nav-tab">Rooms</text>
  <text x="660" y="104" class="text-base nav-tab">Auto-Schedule</text>

  <!-- Section Header -->
  <g transform="translate(45, 145)">
    <text x="0" y="0" class="text-base section-title">Faculty Workload Matrix &amp; Assignment Tracking</text>
    <text x="0" y="20" class="text-base subtext">Monitor teaching units, credit hour compliance, and cross-departmental subject assignments</text>
    
    <!-- Filter Bar -->
    <rect x="740" y="-18" width="220" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="755" y="5" class="text-base" font-size="12" fill="#64748b">Filter by Department: All</text>
    <rect x="975" y="-18" width="135" height="36" rx="6" fill="#2563eb" />
    <text x="1042" y="5" class="text-base" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">+ Assign Subject</text>
  </g>

  <!-- Instructor Cards Grid -->
  <g transform="translate(45, 195)">
    <!-- Card 1: Alan Turing -->
    <rect x="0" y="0" width="355" height="205" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="32" class="text-base card-name">Prof. Alan Turing</text>
    <text x="20" y="50" class="text-base card-dept">Dept. of Computer Science &amp; Engineering</text>
    <rect x="270" y="18" width="65" height="20" rx="4" fill="#eff6ff" />
    <text x="302" y="32" class="text-base tag-text" fill="#2563eb">Full-Time</text>

    <!-- Progress Bar -->
    <text x="20" y="85" class="text-base stat-label">Teaching Load Utilization</text>
    <text x="280" y="85" class="text-base stat-val">18 / 21 Units</text>
    <rect x="20" y="95" width="315" height="8" rx="4" fill="#f1f5f9" />
    <rect x="20" y="95" width="270" height="8" rx="4" fill="#2563eb" />

    <!-- Assigned Subjects List -->
    <line x1="20" y1="120" x2="335" y2="120" stroke="#f1f5f9" stroke-width="1" />
    <text x="20" y="142" class="text-base" font-size="11" font-weight="600" fill="#334155">CS101 — Data Structures (6.0h / 3 units)</text>
    <text x="20" y="162" class="text-base" font-size="11" font-weight="600" fill="#334155">CS205 — Algorithm Analysis (4.5h / 3 units)</text>
    <text x="20" y="182" class="text-base" font-size="11" font-weight="600" fill="#334155">CS401 — Capstone Project I (3.0h / 3 units)</text>

    <!-- Card 2: Ada Lovelace -->
    <rect x="380" y="0" width="355" height="205" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="400" y="32" class="text-base card-name">Dr. Ada Lovelace</text>
    <text x="400" y="50" class="text-base card-dept">Dept. of Information Technology</text>
    <rect x="650" y="18" width="65" height="20" rx="4" fill="#eff6ff" />
    <text x="682" y="32" class="text-base tag-text" fill="#2563eb">Full-Time</text>

    <!-- Progress Bar (Optimal) -->
    <text x="400" y="85" class="text-base stat-label">Teaching Load Utilization</text>
    <text x="660" y="85" class="text-base stat-val">21 / 21 Units</text>
    <rect x="400" y="95" width="315" height="8" rx="4" fill="#f1f5f9" />
    <rect x="400" y="95" width="315" height="8" rx="4" fill="#059669" />

    <!-- Assigned Subjects List -->
    <line x1="400" y1="120" x2="715" y2="120" stroke="#f1f5f9" stroke-width="1" />
    <text x="400" y="142" class="text-base" font-size="11" font-weight="600" fill="#334155">IT202 — Database Systems (6.0h / 3 units)</text>
    <text x="400" y="162" class="text-base" font-size="11" font-weight="600" fill="#334155">IT305 — Advanced Web Eng. (6.0h / 3 units)</text>
    <text x="400" y="182" class="text-base" font-size="11" font-weight="600" fill="#334155">IT402 — Systems Architecture (4.5h / 3 units)</text>

    <!-- Card 3: Claude Shannon (Overload Warning) -->
    <rect x="760" y="0" width="355" height="205" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="780" y="32" class="text-base card-name">Engr. Claude Shannon</text>
    <text x="780" y="50" class="text-base card-dept">Dept. of Electronics &amp; Communications</text>
    <rect x="1030" y="18" width="65" height="20" rx="4" fill="#fef3c7" />
    <text x="1062" y="32" class="text-base tag-text" fill="#d97706">Overload</text>

    <!-- Progress Bar (Overload) -->
    <text x="780" y="85" class="text-base stat-label">Teaching Load Utilization</text>
    <text x="1040" y="85" class="text-base stat-val" fill="#d97706">24 / 21 Units</text>
    <rect x="780" y="95" width="315" height="8" rx="4" fill="#f1f5f9" />
    <rect x="780" y="95" width="315" height="8" rx="4" fill="#d97706" />

    <!-- Assigned Subjects List -->
    <line x1="780" y1="120" x2="1095" y2="120" stroke="#f1f5f9" stroke-width="1" />
    <text x="780" y="142" class="text-base" font-size="11" font-weight="600" fill="#334155">NET301 — Computer Networks (6.0h / 3 units)</text>
    <text x="780" y="162" class="text-base" font-size="11" font-weight="600" fill="#334155">ECE404 — Information Theory (4.5h / 3 units)</text>
    <text x="780" y="182" class="text-base" font-size="11" font-weight="600" fill="#334155">ECE410 — Digital Signals Lab (4.5h / 3 units)</text>
  </g>

  <!-- Bottom Analytics Summary Bar -->
  <g transform="translate(45, 420)">
    <rect x="0" y="0" width="1070" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="1070" height="38" fill="#f8fafc" rx="8" />
    <text x="20" y="24" class="text-base" font-size="12" font-weight="600" fill="#475569">FACULTY ROSTER SUMMARY &amp; WORKLOAD DISTRIBUTION</text>
    
    <!-- Table Header -->
    <text x="30" y="65" class="text-base" font-size="11" font-weight="600" fill="#64748b">FACULTY MEMBER</text>
    <text x="240" y="65" class="text-base" font-size="11" font-weight="600" fill="#64748b">DEPARTMENT</text>
    <text x="440" y="65" class="text-base" font-size="11" font-weight="600" fill="#64748b">EMPLOYMENT</text>
    <text x="590" y="65" class="text-base" font-size="11" font-weight="600" fill="#64748b">ASSIGNED SUBJECTS</text>
    <text x="780" y="65" class="text-base" font-size="11" font-weight="600" fill="#64748b">CURRENT LOAD</text>
    <text x="960" y="65" class="text-base" font-size="11" font-weight="600" fill="#64748b">COMPLIANCE</text>

    <line x1="20" y1="78" x2="1050" y2="78" stroke="#f1f5f9" stroke-width="1" />
    
    <!-- Row 1 -->
    <text x="30" y="105" class="text-base" font-size="12" font-weight="600" fill="#0f172a">Prof. Alan Turing</text>
    <text x="240" y="105" class="text-base" font-size="12" fill="#475569">Computer Science</text>
    <text x="440" y="105" class="text-base" font-size="12" fill="#475569">Permanent / Full-Time</text>
    <text x="590" y="105" class="text-base" font-size="12" fill="#475569">3 Subjects (13.5 hrs)</text>
    <text x="780" y="105" class="text-base" font-size="12" font-weight="600" fill="#1e293b">18 / 21 Units</text>
    <rect x="960" y="90" width="70" height="20" rx="4" fill="#ecfdf5" />
    <text x="995" y="104" class="text-base tag-text" fill="#059669">Within Limit</text>

    <line x1="20" y1="120" x2="1050" y2="120" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 2 -->
    <text x="30" y="145" class="text-base" font-size="12" font-weight="600" fill="#0f172a">Dr. Ada Lovelace</text>
    <text x="240" y="145" class="text-base" font-size="12" fill="#475569">Information Tech</text>
    <text x="440" y="145" class="text-base" font-size="12" fill="#475569">Permanent / Full-Time</text>
    <text x="590" y="145" class="text-base" font-size="12" fill="#475569">3 Subjects (16.5 hrs)</text>
    <text x="780" y="145" class="text-base" font-size="12" font-weight="600" fill="#1e293b">21 / 21 Units</text>
    <rect x="960" y="130" width="70" height="20" rx="4" fill="#ecfdf5" />
    <text x="995" y="144" class="text-base tag-text" fill="#059669">Within Limit</text>

    <line x1="20" y1="160" x2="1050" y2="160" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 3 -->
    <text x="30" y="185" class="text-base" font-size="12" font-weight="600" fill="#0f172a">Engr. Claude Shannon</text>
    <text x="240" y="185" class="text-base" font-size="12" fill="#475569">Electronics &amp; Comm</text>
    <text x="440" y="185" class="text-base" font-size="12" fill="#475569">Permanent / Full-Time</text>
    <text x="590" y="185" class="text-base" font-size="12" fill="#475569">4 Subjects (15.0 hrs)</text>
    <text x="780" y="185" class="text-base" font-size="12" font-weight="600" fill="#d97706">24 / 21 Units</text>
    <rect x="960" y="170" width="70" height="20" rx="4" fill="#fef3c7" />
    <text x="995" y="184" class="text-base tag-text" fill="#d97706">Approved OL</text>
  </g>
</svg>

