<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .text-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .nav-tab { font-size: 13px; font-weight: 600; fill: #475569; }
      .nav-active { font-size: 13px; font-weight: 600; fill: #2563eb; }
      .card-title { font-size: 14px; font-weight: 600; fill: #1e293b; }
      .time-col { font-size: 11px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
      .slot-title { font-size: 12px; font-weight: 700; fill: #1e3a8a; }
      .slot-sub { font-size: 10px; font-weight: 500; fill: #3b82f6; }
      .slot-green-title { font-size: 12px; font-weight: 700; fill: #065f46; }
      .slot-green-sub { font-size: 10px; font-weight: 500; fill: #059669; }
      .slot-purple-title { font-size: 12px; font-weight: 700; fill: #581c87; }
      .slot-purple-sub { font-size: 10px; font-weight: 500; fill: #7e22ce; }
      .badge-text { font-size: 11px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="#f8fafc" />

  <!-- Window Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- App Header / Window Controls -->
  <path d="M 20 30 Q 20 20 30 20 L 1170 20 Q 1180 20 1180 30 L 1180 75 L 20 75 Z" fill="#0f172a" />
  <circle cx="45" cy="47" r="6" fill="#ef4444" />
  <circle cx="65" cy="47" r="6" fill="#f59e0b" />
  <circle cx="85" cy="47" r="6" fill="#10b981" />
  <text x="115" y="52" class="text-base" font-size="14" font-weight="600" fill="#f8fafc">Institutional Academic Scheduler — Master Calendar View</text>
  <rect x="980" y="37" width="180" height="26" rx="5" fill="#1e293b" />
  <text x="1070" y="54" class="text-base" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Term: 1st Semester 2026-2027</text>

  <!-- Top Navigation Bar -->
  <rect x="20" y="75" width="1160" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="104" class="text-base nav-tab">Analytics</text>
  <text x="120" y="104" class="text-base nav-tab">Course Assignments</text>
  <text x="260" y="104" class="text-base nav-active">Master Calendar</text>
  <line x1="260" y1="121" x2="360" y2="121" stroke="#2563eb" stroke-width="2.5" />
  <text x="390" y="104" class="text-base nav-tab">Faculty</text>
  <text x="455" y="104" class="text-base nav-tab">Courses</text>
  <text x="525" y="104" class="text-base nav-tab">Sections</text>
  <text x="595" y="104" class="text-base nav-tab">Rooms</text>
  <text x="660" y="104" class="text-base nav-tab">Auto-Schedule</text>

  <!-- View Controls Toolbar -->
  <rect x="40" y="140" width="1120" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Perspective Switcher -->
  <rect x="55" y="152" width="260" height="30" rx="6" fill="#e2e8f0" />
  <rect x="57" y="154" width="84" height="26" rx="5" fill="#ffffff" />
  <text x="99" y="171" class="text-base" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Room</text>
  <text x="185" y="171" class="text-base" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Instructor</text>
  <text x="270" y="171" class="text-base" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Section</text>

  <!-- Target Selector Dropdown -->
  <rect x="335" y="152" width="240" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="350" y="171" class="text-base" font-size="12" font-weight="500" fill="#1e293b">Room 301 (Computer Lab 1)</text>
  <polygon points="555,165 565,165 560,172" fill="#64748b" />

  <!-- Action Badges / Saturday Toggle -->
  <rect x="850" y="152" width="140" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="960" y="157" width="22" height="20" rx="10" fill="#2563eb" />
  <circle cx="974" cy="167" r="7" fill="#ffffff" />
  <text x="865" y="171" class="text-base" font-size="12" font-weight="500" fill="#334155">Saturday View</text>

  <rect x="1005" y="152" width="140" height="30" rx="6" fill="#2563eb" />
  <text x="1075" y="171" class="text-base" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">+ Custom Block</text>

  <!-- Timetable Grid Header -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="1120" height="36" fill="#f1f5f9" rx="6" />
    <text x="40" y="22" class="text-base time-col">TIME</text>
    <text x="160" y="22" class="text-base card-title">Monday</text>
    <text x="330" y="22" class="text-base card-title">Tuesday</text>
    <text x="500" y="22" class="text-base card-title">Wednesday</text>
    <text x="670" y="22" class="text-base card-title">Thursday</text>
    <text x="840" y="22" class="text-base card-title">Friday</text>
    <text x="1010" y="22" class="text-base card-title">Saturday</text>
  </g>

  <!-- Grid Body Lines -->
  <g transform="translate(40, 246)">
    <!-- Time Column & Grid Rows -->
    <rect x="0" y="0" width="1120" height="375" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4" />
    <line x1="80" y1="0" x2="80" y2="375" stroke="#f1f5f9" stroke-width="1.5" />
    <line x1="250" y1="0" x2="250" y2="375" stroke="#f1f5f9" stroke-width="1.5" />
    <line x1="420" y1="0" x2="420" y2="375" stroke="#f1f5f9" stroke-width="1.5" />
    <line x1="590" y1="0" x2="590" y2="375" stroke="#f1f5f9" stroke-width="1.5" />
    <line x1="760" y1="0" x2="760" y2="375" stroke="#f1f5f9" stroke-width="1.5" />
    <line x1="930" y1="0" x2="930" y2="375" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Horizontal Hour Lines -->
    <line x1="0" y1="62" x2="1120" y2="62" stroke="#f8fafc" stroke-width="1" />
    <line x1="0" y1="125" x2="1120" y2="125" stroke="#f8fafc" stroke-width="1" />
    <line x1="0" y1="187" x2="1120" y2="187" stroke="#f8fafc" stroke-width="1" />
    <line x1="0" y1="250" x2="1120" y2="250" stroke="#f8fafc" stroke-width="1" />
    <line x1="0" y1="312" x2="1120" y2="312" stroke="#f8fafc" stroke-width="1" />

    <!-- Time Labels -->
    <text x="40" y="35" class="text-base time-col">08:00 AM</text>
    <text x="40" y="98" class="text-base time-col">09:30 AM</text>
    <text x="40" y="160" class="text-base time-col">11:00 AM</text>
    <text x="40" y="222" class="text-base time-col">01:00 PM</text>
    <text x="40" y="285" class="text-base time-col">02:30 PM</text>
    <text x="40" y="347" class="text-base time-col">04:00 PM</text>

    <!-- Calendar Slot: CS101 Lecture -->
    <g transform="translate(85, 10)">
      <rect width="160" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <rect width="4" height="85" rx="2" fill="#2563eb" />
      <text x="12" y="22" class="text-base slot-title">CS101 • Section 1A</text>
      <text x="12" y="38" class="text-base slot-sub">Data Structures &amp; Algorithms</text>
      <text x="12" y="55" class="text-base" font-size="10" font-weight="500" fill="#475569">Prof. Alan Turing</text>
      <text x="12" y="72" class="text-base" font-size="10" font-weight="600" fill="#2563eb">08:00 AM - 09:30 AM</text>
    </g>

    <!-- Calendar Slot: ENG204 Wednesday -->
    <g transform="translate(425, 10)">
      <rect width="160" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <rect width="4" height="85" rx="2" fill="#2563eb" />
      <text x="12" y="22" class="text-base slot-title">CS101 • Section 1A</text>
      <text x="12" y="38" class="text-base slot-sub">Data Structures &amp; Algorithms</text>
      <text x="12" y="55" class="text-base" font-size="10" font-weight="500" fill="#475569">Prof. Alan Turing</text>
      <text x="12" y="72" class="text-base" font-size="10" font-weight="600" fill="#2563eb">08:00 AM - 09:30 AM</text>
    </g>

    <!-- Calendar Slot: IT202 Database Lab -->
    <g transform="translate(255, 75)">
      <rect width="160" height="110" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <rect width="4" height="110" rx="2" fill="#059669" />
      <text x="12" y="22" class="text-base slot-green-title">IT202 • Section 2B</text>
      <text x="12" y="38" class="text-base slot-green-sub">Database Systems (Lab)</text>
      <text x="12" y="55" class="text-base" font-size="10" font-weight="500" fill="#334155">Dr. Ada Lovelace</text>
      <text x="12" y="72" class="text-base" font-size="10" font-weight="600" fill="#059669">09:30 AM - 12:30 PM</text>
    </g>

    <!-- Calendar Slot: IT202 Database Lab Thursday -->
    <g transform="translate(595, 75)">
      <rect width="160" height="110" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <rect width="4" height="110" rx="2" fill="#059669" />
      <text x="12" y="22" class="text-base slot-green-title">IT202 • Section 2B</text>
      <text x="12" y="38" class="text-base slot-green-sub">Database Systems (Lab)</text>
      <text x="12" y="55" class="text-base" font-size="10" font-weight="500" fill="#334155">Dr. Ada Lovelace</text>
      <text x="12" y="72" class="text-base" font-size="10" font-weight="600" fill="#059669">09:30 AM - 12:30 PM</text>
    </g>

    <!-- Institutional Lunch Break Block across all days -->
    <g transform="translate(85, 195)">
      <rect width="1025" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1" />
      <text x="512" y="25" class="text-base" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">INSTITUTIONAL RECESS / FACULTY LUNCH BREAK (12:00 PM – 01:00 PM)</text>
    </g>

    <!-- Calendar Slot: NET301 Friday -->
    <g transform="translate(765, 245)">
      <rect width="160" height="90" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
      <rect width="4" height="90" rx="2" fill="#9333ea" />
      <text x="12" y="22" class="text-base slot-purple-title">NET301 • Section 3A</text>
      <text x="12" y="38" class="text-base slot-purple-sub">Computer Networks &amp; Security</text>
      <text x="12" y="55" class="text-base" font-size="10" font-weight="500" fill="#475569">Engr. Claude Shannon</text>
      <text x="12" y="72" class="text-base" font-size="10" font-weight="600" fill="#9333ea">01:30 PM - 03:00 PM</text>
    </g>

    <!-- Saturday Session -->
    <g transform="translate(935, 30)">
      <rect width="160" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="text-base" font-size="11" font-weight="700" fill="#334155">ROTC / CWTS 101</text>
      <text x="12" y="40" class="text-base" font-size="10" font-weight="500" fill="#64748b">Civic Training Service</text>
      <text x="12" y="58" class="text-base" font-size="10" font-weight="500" fill="#334155">Field Instructor</text>
      <text x="12" y="76" class="text-base" font-size="10" font-weight="600" fill="#475569">08:00 AM - 12:00 PM</text>
      <rect x="12" y="88" width="80" height="18" rx="3" fill="#e2e8f0" />
      <text x="52" y="101" class="text-base" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Non-Academic</text>
    </g>
  </g>
</svg>

