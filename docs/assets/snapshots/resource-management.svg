<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .text-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .header-title { font-size: 14px; font-weight: 600; fill: #f8fafc; }
      .nav-tab { font-size: 13px; font-weight: 600; fill: #475569; }
      .nav-active { font-size: 13px; font-weight: 600; fill: #2563eb; }
      .section-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtext { font-size: 13px; font-weight: 400; fill: #64748b; }
      .tbl-head { font-size: 11px; font-weight: 600; fill: #64748b; text-transform: uppercase; }
      .tbl-cell { font-size: 12px; font-weight: 500; fill: #1e293b; }
      .badge-txt { font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc" />

  <!-- Window Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- App Header -->
  <path d="M 20 30 Q 20 20 30 20 L 1170 20 Q 1180 20 1180 30 L 1180 75 L 20 75 Z" fill="#0f172a" />
  <circle cx="45" cy="47" r="6" fill="#ef4444" />
  <circle cx="65" cy="47" r="6" fill="#f59e0b" />
  <circle cx="85" cy="47" r="6" fill="#10b981" />
  <text x="115" y="52" class="text-base header-title">Institutional Academic Scheduler — Curricula &amp; Resource Catalog</text>

  <!-- Top Navigation Bar -->
  <rect x="20" y="75" width="1160" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="104" class="text-base nav-tab">Analytics</text>
  <text x="120" y="104" class="text-base nav-tab">Course Assignments</text>
  <text x="260" y="104" class="text-base nav-tab">Master Calendar</text>
  <text x="390" y="104" class="text-base nav-tab">Faculty</text>
  <text x="455" y="104" class="text-base nav-active">Courses</text>
  <line x1="455" y1="121" x2="505" y2="121" stroke="#2563eb" stroke-width="2.5" />
  <text x="525" y="104" class="text-base nav-tab">Sections</text>
  <text x="595" y="104" class="text-base nav-tab">Rooms</text>
  <text x="660" y="104" class="text-base nav-tab">Auto-Schedule</text>

  <!-- Section Header -->
  <g transform="translate(45, 145)">
    <text x="0" y="0" class="text-base section-title">Curriculum Subjects &amp; Laboratory Requirements</text>
    <text x="0" y="20" class="text-base subtext">Standardized course definitions, lecture/laboratory credit hour allocations, and facility prerequisites</text>

    <!-- Search & Filters -->
    <rect x="630" y="-18" width="220" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="645" y="5" class="text-base" font-size="12" fill="#94a3b8">Search course or code...</text>

    <rect x="865" y="-18" width="120" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="880" y="5" class="text-base" font-size="12" fill="#475569">Import CSV</text>

    <rect x="1000" y="-18" width="110" height="36" rx="6" fill="#2563eb" />
    <text x="1055" y="5" class="text-base" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add Course</text>
  </g>

  <!-- Courses Table Container -->
  <g transform="translate(45, 205)">
    <rect x="0" y="0" width="1070" height="415" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Table Header -->
    <rect x="0" y="0" width="1070" height="38" fill="#f8fafc" rx="8" />
    <text x="25" y="24" class="text-base tbl-head">CODE</text>
    <text x="110" y="24" class="text-base tbl-head">COURSE DESCRIPTIVE TITLE</text>
    <text x="370" y="24" class="text-base tbl-head">DEPARTMENT</text>
    <text x="540" y="24" class="text-base tbl-head">LEC / LAB UNITS</text>
    <text x="680" y="24" class="text-base tbl-head">WEEKLY CONTACT HRS</text>
