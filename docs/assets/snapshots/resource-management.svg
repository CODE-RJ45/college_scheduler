    <!-- Row 1 -->
    <line x1="0" y1="85" x2="1070" y2="85" stroke="#f1f5f9" stroke-width="1" />
    <text x="25" y="65" class="text-base tbl-cell" font-weight="700" fill="#0f172a">CS 101</text>
    <text x="110" y="58" class="text-base tbl-cell" font-weight="600">Data Structures &amp; Algorithms</text>
    <text x="110" y="74" class="text-base" font-size="11" fill="#64748b">Prerequisite: CS 100 (Intro to Prog)</text>
    <text x="370" y="65" class="text-base tbl-cell">Computer Science</text>
    <text x="540" y="65" class="text-base tbl-cell">2 Lec / 1 Lab (3.0)</text>
    <text x="680" y="65" class="text-base tbl-cell">5.0 Hours / Week</text>
    <rect x="850" y="51" width="105" height="22" rx="4" fill="#eff6ff" />
    <text x="902" y="66" class="text-base badge-txt" fill="#2563eb">Computer Lab</text>
    <text x="1000" y="65" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Edit • Delete</text>

    <!-- Row 2 -->
    <line x1="0" y1="140" x2="1070" y2="140" stroke="#f1f5f9" stroke-width="1" />
    <text x="25" y="120" class="text-base tbl-cell" font-weight="700" fill="#0f172a">IT 202</text>
    <text x="110" y="113" class="text-base tbl-cell" font-weight="600">Database Management Systems</text>
    <text x="110" y="129" class="text-base" font-size="11" fill="#64748b">Prerequisite: CS 101</text>
    <text x="370" y="120" class="text-base tbl-cell">Information Tech</text>
    <text x="540" y="120" class="text-base tbl-cell">2 Lec / 1 Lab (3.0)</text>
    <text x="680" y="120" class="text-base tbl-cell">5.0 Hours / Week</text>
    <rect x="850" y="106" width="105" height="22" rx="4" fill="#eff6ff" />
    <text x="902" y="121" class="text-base badge-txt" fill="#2563eb">Computer Lab</text>
    <text x="1000" y="120" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Edit • Delete</text>

    <!-- Row 3 -->
    <line x1="0" y1="195" x2="1070" y2="195" stroke="#f1f5f9" stroke-width="1" />
    <text x="25" y="175" class="text-base tbl-cell" font-weight="700" fill="#0f172a">MATH 114</text>
    <text x="110" y="168" class="text-base tbl-cell" font-weight="600">Discrete Mathematics</text>
    <text x="110" y="184" class="text-base" font-size="11" fill="#64748b">Prerequisite: College Algebra</text>
    <text x="370" y="175" class="text-base tbl-cell">Mathematics</text>
    <text x="540" y="175" class="text-base tbl-cell">3 Lec / 0 Lab (3.0)</text>
    <text x="680" y="175" class="text-base tbl-cell">3.0 Hours / Week</text>
    <rect x="850" y="161" width="105" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="902" y="176" class="text-base badge-txt" fill="#475569">Standard Lecture</text>
    <text x="1000" y="175" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Edit • Delete</text>

    <!-- Row 4 -->
    <line x1="0" y1="250" x2="1070" y2="250" stroke="#f1f5f9" stroke-width="1" />
    <text x="25" y="230" class="text-base tbl-cell" font-weight="700" fill="#0f172a">NET 301</text>
    <text x="110" y="223" class="text-base tbl-cell" font-weight="600">Computer Networks &amp; Security</text>
    <text x="110" y="239" class="text-base" font-size="11" fill="#64748b">Prerequisite: IT 202</text>
    <text x="370" y="230" class="text-base tbl-cell">Information Tech</text>
    <text x="540" y="230" class="text-base tbl-cell">2 Lec / 1 Lab (3.0)</text>
    <text x="680" y="230" class="text-base tbl-cell">5.0 Hours / Week</text>
    <rect x="850" y="216" width="105" height="22" rx="4" fill="#eff6ff" />
    <text x="902" y="231" class="text-base badge-txt" fill="#2563eb">Cisco / Net Lab</text>
    <text x="1000" y="230" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Edit • Delete</text>

    <!-- Row 5 -->
    <line x1="0" y1="305" x2="1070" y2="305" stroke="#f1f5f9" stroke-width="1" />
    <text x="25" y="285" class="text-base tbl-cell" font-weight="700" fill="#0f172a">PHYS 101</text>
    <text x="110" y="278" class="text-base tbl-cell" font-weight="600">University Physics I (Mechanics)</text>
    <text x="110" y="294" class="text-base" font-size="11" fill="#64748b">Corequisite: MATH 114</text>
    <text x="370" y="285" class="text-base tbl-cell">Physical Sciences</text>
    <text x="540" y="285" class="text-base tbl-cell">3 Lec / 1 Lab (4.0)</text>
    <text x="680" y="285" class="text-base tbl-cell">6.0 Hours / Week</text>
    <rect x="850" y="271" width="105" height="22" rx="4" fill="#eff6ff" />
    <text x="902" y="286" class="text-base badge-txt" fill="#2563eb">Physics Lab</text>
    <text x="1000" y="285" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Edit • Delete</text>

    <!-- Row 6 -->
    <line x1="0" y1="360" x2="1070" y2="360" stroke="#f1f5f9" stroke-width="1" />
    <text x="25" y="340" class="text-base tbl-cell" font-weight="700" fill="#0f172a">GENED 101</text>
    <text x="110" y="333" class="text-base tbl-cell" font-weight="600">Ethics &amp; Professional Leadership</text>
    <text x="110" y="349" class="text-base" font-size="11" fill="#64748b">Prerequisite: None</text>
    <text x="370" y="340" class="text-base tbl-cell">Humanities &amp; Arts</text>
    <text x="540" y="340" class="text-base tbl-cell">3 Lec / 0 Lab (3.0)</text>
    <text x="680" y="340" class="text-base tbl-cell">3.0 Hours / Week</text>
    <rect x="850" y="326" width="105" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="902" y="341" class="text-base badge-txt" fill="#475569">Lecture Hall</text>
    <text x="1000" y="340" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Edit • Delete</text>

    <!-- Table Footer Navigation -->
    <rect x="0" y="365" width="1070" height="50" fill="#f8fafc" rx="8" />
    <text x="25" y="395" class="text-base" font-size="12" font-weight="500" fill="#64748b">Showing 1 to 6 of 142 catalog courses</text>
    <text x="1000" y="395" class="text-base" font-size="12" font-weight="600" fill="#2563eb">Page 1 / 24 &gt;</text>
  </g>
</svg>

